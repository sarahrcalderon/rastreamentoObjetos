[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rastreamento-objetos"
version = "0.1.0"
description = "Pipeline de visão computacional para detecção e rastreamento de objetos"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sarah" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]